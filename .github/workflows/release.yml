name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach binaries to (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Create the release up front so the matrix jobs never race to create
  # it, and so rc tags are auto-detected as prereleases from the version.
  create-release:
    name: create release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          allow-missing-changelog: true

  upload-assets:
    name: ${{ matrix.target }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: Build and upload archive
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: tfrm
          target: ${{ matrix.target }}
          tar: unix
          locked: true
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}

  # Publish the library + CLI crates to crates.io so `cargo install` and
  # `cargo binstall bcl-tfrm` can resolve the version. Runs after the
  # binaries are attached so binstall always finds a prebuilt artifact.
  # The CRATES_IO_TOKEN secret may be absent (e.g. before the crates.io
  # account is wired up); skip with a visible notice instead of failing
  # the workflow.
  publish-crates:
    name: publish to crates.io
    needs: upload-assets
    runs-on: ubuntu-latest
    env:
      # cargo reads the token from CARGO_REGISTRY_TOKEN; the repo secret
      # is named CRATES_IO_TOKEN.
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Check for crates.io token
        id: token
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice title=crates.io publish skipped::CRATES_IO_TOKEN is not configured; binaries were released but the crates were not published. Add the secret and re-run this workflow (workflow_dispatch with the tag) to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish crates
        if: steps.token.outputs.publish == 'true'
        # Explicit -p list; cargo publishes in dependency order and waits
        # for tfrm-core to land on the index before bcl-tfrm.
        run: cargo publish --locked -p tfrm-core -p bcl-tfrm
